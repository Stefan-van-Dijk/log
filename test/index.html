function detourCooldownRemaining(tripId){
  if(!tripId)return 0;
  const latest=data.events.reduce((max,event)=>{
    if(event.tripId!==tripId||event.type!=='detour')return max;
    const timestamp=Date.parse(event.time);
    return Number.isFinite(timestamp)?Math.max(max,timestamp):max;
  },0);
  return latest?Math.min(DETOUR_COOLDOWN_MS,Math.max(0,latest+DETOUR_COOLDOWN_MS-Date.now())):0;
}
function syncDetourCooldown(){
  const button=app.querySelector('.detour-action');
  if(!button||!data.activeTrip){clearInterval(detourCountdownTimer);detourCountdownTimer=null;return}
  const panel=button.closest('.detour-panel');
  const remaining=detourCooldownRemaining(data.activeTrip.id);
  button.disabled=detourSaving||remaining>0;
  panel.classList.toggle('cooldown',remaining>0&&!detourSaving);
  const copy=button.querySelector('.detour-copy'),countdown=panel.querySelector('.detour-countdown'),bar=panel.querySelector('.detour-progress');
  copy.textContent=detourSaving?'GPS ophalen…':remaining>0?'Omrijpunt vastgelegd':'Omrijpunt vastleggen';
  countdown.textContent=!detourSaving&&remaining>0?`Opnieuw over ${Math.ceil(remaining/1000)} s`:'';
  bar.style.width=`${remaining/DETOUR_COOLDOWN_MS*100}%`;
  button.setAttribute('aria-label',detourSaving?'Omrijpunt wordt vastgelegd':remaining>0?`Omrijpunt over ${Math.ceil(remaining/1000)} seconden opnieuw beschikbaar`:'Omrijpunt vastleggen');
  if(remaining>0&&!detourCountdownTimer)detourCountdownTimer=setInterval(syncDetourCooldown,250);
  else if(!remaining&&detourCountdownTimer){clearInterval(detourCountdownTimer);detourCountdownTimer=null}
}

function readGeocodeCache(){try{const x=JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)||'{}');return x&&typeof x==='object'?x:{}}catch(e){return{}}}

function geocodeAddressKey(address){return'address:'+String(address||'').trim().toLowerCase().replace(/\s+/g,' ')}

async function coordinatesForAddress(address){const q=String(address||'').trim(),rows=await geocodeRequest(`/search?format=jsonv2&limit=1&addressdetails=1&accept-language=nl&q=${encodeURIComponent(q)}`,geocodeAddressKey(q)),place=Array.isArray(rows)?rows[0]:null,lat=parseNum(place?.lat),lng=parseNum(place?.lon);if(lat==null||lng==null)throw new Error('Geen GPS-coördinaten gevonden voor dit adres.');return{lat,lng}}

async function recordDetour(button){
  if(detourSaving)return;
  const active=data.activeTrip;
  if(!active)throw new Error('Een omrijpunt kan alleen tijdens een actieve rit worden vastgelegd.');
  if(detourCooldownRemaining(active.id)>0)return;
  detourSaving=true;
  button.disabled=true;
  syncDetourCooldown();
  const recordedAt=new Date().toISOString();
  try{
    let loc=null;
    try{const g=await getPosition();loc=matches(g)[0]?.location||currentLoc(g)}
    catch(error){if(gpsLatest)loc=matches(gpsLatest)[0]?.location||currentLoc(gpsLatest)}
    if(data.activeTrip?.id!==active.id)throw new Error('De actieve rit is intussen gewijzigd.');
    const point={id:uid(),type:'detour',tripId:active.id,odometer:null,location:snap(loc),note:'',time:recordedAt};
    data.events.push(point);
    try{save()}catch(error){data.events=data.events.filter(event=>event!==point);throw error}
    render();
    toast(loc?'Omrijpunt aan rit gekoppeld.':'Omrijpunt zonder GPS-locatie aan rit gekoppeld.');
  }finally{
    detourSaving=false;
    syncDetourCooldown();
  }

async function shareCsv(){const result=await deliverFile(new Blob([csvText()],{type:'text/csv;charset=utf-8'}),`kilometerregistratie-${periodSlug()}.csv`,'Kilometerregistratie '+periodLabel());if(result==='shared')toast('CSV gedeeld.');else if(result==='downloaded')toast('CSV als download aangeboden.')}
function emailReport(){const t=totals(reportTrips()),field=document.querySelector('#settingsForm [name="reportEmail"]'),to=(field?.value||data.settings.reportEmail||''),lines=[`${periodLabel()}`,`Totaal: ${km(t.total)} km`];if(t.business>0)lines.push(`Zakelijk: ${km(t.business)} km`);if(t.commute>0)lines.push(`Woon-werk: ${km(t.commute)} km`);if(t.private>0)lines.push(`Privé: ${km(t.private)} km`);location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent('Kilometerregistratie '+periodLabel())}&body=${encodeURIComponent(lines.join('\n'))}`}
function printPeriod(){const trips=reportTrips(),t=totals(trips);printReportEl.innerHTML=`<h1>Kilometerregistratie – ${esc(periodLabel())}</h1><p>${esc(data.settings.name||'')}${data.settings.plate?' · '+esc(data.settings.plate):''}</p><p>${esc(periodSubLabel(trips))}</p>${summary(t,'Overzicht',trips.length)}<div style="margin-top:18px">${tripList(trips)}</div>`;window.print();setTimeout(()=>printReportEl.innerHTML='',1000)}
async function deliverFile(blob,name,title){if(typeof File==='function'&&navigator.share&&navigator.canShare){const file=new File([blob],name,{type:blob.type||'application/octet-stream'});let canShare=false;try{canShare=navigator.canShare({files:[file]})}catch(_){}if(canShare){try{await navigator.share({files:[file],title});return'shared'}catch(error){if(error?.name==='AbortError')return'cancelled';throw error}}}download(blob,name);return'downloaded'}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
})();
</script>
